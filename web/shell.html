<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<!-- viewport-fit=cover so the pad can sit in the safe area on a notched phone -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#110011">
<title>PicoSystem</title>
<style>
  /* Same console palette as the gallery: every hex pair is a repeated nibble,
     so all of it is representable in the device's own ARGB4444 framebuffer. */
  :root {
    --ground: #110011;
    --panel: #221133;
    --panel-lit: #332255;
    --ink: #ffffee;
    --muted: #9988bb;
    --line: #553377;
    --accent: #ff2266;
    --play: #22ffaa;
    --dpad: #2a1b3d;
    --dpad-lit: #ff2266;
    --btn-face: #3a2450;
    --pad-size: min(46vw, 230px);
    --btn: min(19vw, 84px);
    --pad-area: calc(var(--pad-size) + 2.5rem);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* Touch must never scroll, pinch, or pull to refresh: every one of those
       turns a D-pad press into a page gesture. */
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  #app {
    height: 100%;
    height: 100dvh;              /* dvh so browser chrome does not crop the pad */
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Top aligned, handheld style: screen up top, controls down where a thumb
       actually rests. Centring the screen pushes the pad off the bottom of a
       short viewport. */
    justify-content: flex-start;
    gap: 0.5rem;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---- screen ---- */

  #stage {
    position: relative;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    min-height: 0;
  }

  /* The frame is the space the screen may occupy. The pad's area is reserved
     first, so the controls can never be pushed off the bottom. */
  #frame {
    width: min(100vw - 0.75rem, calc(100dvh - var(--pad-area) - 4rem));
    height: min(100vw - 0.75rem, calc(100dvh - var(--pad-area) - 4rem));
    display: grid;
    place-items: center;
    overflow: hidden;
    outline: 3px solid var(--line);
    background: #000011;
  }

  canvas.emscripten {
    display: block;
    border: 0 none;
    background: #000011;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    /* Pinned to the console's resolution and zoomed with a transform.
       See setZoom() for why the size is fixed here rather than responsive. */
    width: 240px;
    height: 240px;
    transform-origin: center center;
  }

  /* ---- loading ---- */

  #crash {
    position: fixed;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    width: min(92vw, 480px);
    background: #221133;
    border: 1px solid #ff2266;
    border-radius: 8px;
    padding: 10px;
    color: #ffffee;
  }
  .crash-head {
    color: #ff2266;
    font-size: 13px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .crash-body {
    margin: 0 0 8px;
    max-height: 40vh;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 11px;
    color: #d9d4ee;
  }
  .crash-copy {
    background: #332255;
    color: #ffcc22;
    border: 1px solid #553377;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  #newbuild {
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    background: #221133;
    color: #ffcc22;
    border: 1px solid #553377;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  #boot {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 0.75rem;
    background: var(--ground);
    pointer-events: none;
    transition: opacity 200ms;
  }
  #boot.done { opacity: 0; }

  .spinner {
    height: 44px; width: 44px;
    animation: rotation 0.8s linear infinite;
    border: 8px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 100%;
  }
  @keyframes rotation { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  #status { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; }
  progress { width: 60vw; max-width: 260px; }

  /* ---- top bar ---- */

  #bar {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    font-size: 0.6875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #bar a, #bar button {
    font: inherit;
    text-transform: inherit;
    letter-spacing: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 0.3rem 0.6rem;
    text-decoration: none;
    cursor: pointer;
  }
  #bar button:active { background: var(--line); }
  #bar :focus-visible { outline: 2px solid var(--play); outline-offset: 2px; }

  /* ---- gamepad ---- */

  #pad {
    display: none;                 /* shown for touch devices, or forced on */
    width: 100%;
    max-width: 560px;
    padding: 0 1rem 0.5rem;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex: 0 0 auto;
    /* Pushed to the bottom of the column, under whatever the screen left. */
    margin-top: auto;
  }
  body.show-pad #pad { display: flex; }

  /* One solid cross, not four separate keys. Built as a 3x3 grid with no gaps
     so the arms and the hub fuse into a single shape, which is what makes a
     thumb roll across the middle feel continuous. */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: var(--pad-size);
    height: var(--pad-size);
    flex: 0 0 auto;
    filter: drop-shadow(0 4px 0 #00000066);
  }

  .dpad button, .dpad .hub {
    background: var(--dpad);
    border: 0;
    margin: 0;
    padding: 0;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    display: grid;
    place-items: center;
  }

  .dpad button[data-dir="up"]    { grid-area: 1 / 2; border-radius: 10px 10px 0 0; }
  .dpad button[data-dir="left"]  { grid-area: 2 / 1; border-radius: 10px 0 0 10px; }
  .dpad .hub                     { grid-area: 2 / 2; }
  .dpad button[data-dir="right"] { grid-area: 2 / 3; border-radius: 0 10px 10px 0; }
  .dpad button[data-dir="down"]  { grid-area: 3 / 2; border-radius: 0 0 10px 10px; }

  /* A dimple in the hub, like the moulded centre of a real cross pad. */
  .dpad .hub::after {
    content: "";
    width: 34%;
    height: 34%;
    border-radius: 50%;
    background: #00000033;
  }

  .face {
    position: relative;
    width: calc(var(--btn) * 2.5);
    height: calc(var(--btn) * 2.5);
    flex: 0 0 auto;
  }

  .face button {
    position: absolute;
    width: var(--btn);
    height: var(--btn);
    border-radius: 50%;
    background: var(--btn-face);
    border: 0;
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    display: grid;
    place-items: center;
    /* Hard offset shadow rather than a blur: it reads as a moulded button
       instead of a CSS drop shadow. */
    box-shadow: 0 4px 0 #00000066, inset 0 2px 0 #ffffff14;
  }
  /* The press offset uses `translate`, not `transform`: transform is already
     carrying each button's -50% centring, and overwriting it makes the button
     jump sideways on touch. */
  .face button:active { translate: 0 2px; box-shadow: 0 2px 0 #00000066; }
  /* PicoSystem face layout: X top, Y left, A right, B bottom. */
  .face button[data-btn="x"] { left: 50%; top: 0; transform: translateX(-50%); }
  .face button[data-btn="y"] { left: 0; top: 50%; transform: translateY(-50%); }
  .face button[data-btn="a"] { right: 0; top: 50%; transform: translateY(-50%); }
  .face button[data-btn="b"] { left: 50%; bottom: 0; transform: translateX(-50%); }

  /* A and B carry the colour, because they are the two a player actually hunts
     for. X and Y stay neutral so the pair stands out. */
  .face button[data-btn="a"] { background: #99114a; color: #ffdde8; }
  .face button[data-btn="b"] { background: #145c47; color: #ccffee; }

  /* .held is set by the pointer handling, not :active, because a finger that
     slides off a button must keep it lit until it is actually released. */
  #pad button.held {
    background: var(--dpad-lit);
    color: var(--ground);
  }
  .face button.held { translate: 0 2px; box-shadow: 0 2px 0 #00000066; }

  /* ---- the mini tutorial ----

     What the game wants and what each button does, as panels. It sits between
     the screen and the pad, which is the one place a thumb is not already
     going, and it holds a fixed height so paging through it cannot move the
     gamepad under the player's fingers. */
  #tutorial {
    flex: 0 0 auto;
    width: min(100%, 30rem);
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-size: 0.6875rem;
  }

  #tutorial .panels {
    position: relative;
    min-height: 4.5rem;
    display: grid;
  }

  /* Every panel is stacked in the same cell and only one is shown, so the
     block never changes height as you page and nothing below it moves. */
  #tutorial .panel {
    grid-area: 1 / 1;
    visibility: hidden;
    border: 2px solid var(--line);
    background: var(--panel);
    padding: 0.4rem 0.6rem;
  }
  #tutorial .panel[data-shown] { visibility: visible; }

  #tutorial h2 {
    margin: 0 0 0.25rem;
    font-size: 0.625rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  #tutorial p { margin: 0; color: var(--ink); line-height: 1.35; }

  #tutorial .keys {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  #tutorial .keys li {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
  }

  #tutorial .keys kbd {
    flex: 0 0 auto;
    min-width: 3.2rem;
    font: inherit;
    text-align: center;
    border: 1px solid var(--line);
    background: var(--ground);
    color: var(--ink);
    padding: 0 0.25rem;
  }

  /* The keyboard key beside the console button. A game names its controls by
     the button on the console, which is also what the on-screen pad shows,
     and someone playing on a keyboard has no way to know A is Z. Dimmer than
     the button it translates, because on a phone it means nothing. */
  #tutorial .keys kbd.kb {
    min-width: 2.2rem;
    border-style: dashed;
    color: var(--muted);
    background: transparent;
  }

  #tutorial .keys span { color: var(--muted); }

  .tut-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    min-height: 1.1rem;
  }

  .tut-arrow {
    font: inherit;
    font-size: 0.625rem;
    line-height: 1;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid var(--line);
    padding: 0.2rem 0.5rem;
    cursor: pointer;
  }
  .tut-arrow:active { background: var(--line); }
  .tut-arrow:focus-visible { outline: 2px solid var(--play); outline-offset: 2px; }

  .dots { display: flex; gap: 0.25rem; }
  .dot {
    width: 5px; height: 5px;
    background: var(--line);
  }
  .dot[data-on] { background: var(--accent); }

  /* In landscape the pad flanks the screen instead of sitting under it. */
  @media (orientation: landscape) and (max-height: 560px) {
    #app { flex-direction: row; gap: 0.75rem; justify-content: center; }
    #pad {
      position: fixed;
      inset: 0;
      max-width: none;
      pointer-events: none;
      align-items: center;
    }
    #pad > * { pointer-events: auto; }
    :root { --pad-size: min(34vh, 170px); --btn: min(13vh, 62px); }
    /* Resize the frame, never the canvas. The canvas stays pinned at 240x240
       because its CSS box is what sets the render buffer. */
    #frame { width: 92dvh; height: 92dvh; }
    #pad { margin-top: 0; }
    #bar { position: fixed; top: 0.4rem; right: 0.4rem; z-index: 5; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <a href="../" title="Back to the gallery">&larr;</a>
    <button id="fullscreen" type="button">Fullscreen</button>
    <button id="togglepad" type="button">Controls</button>
  </div>

  <div id="stage">
    <div id="frame">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
    <div id="boot">
      <div class="spinner" id="spinner"></div>
      <div id="status">Downloading...</div>
      <progress value="0" max="100" id="progress" hidden></progress>
    </div>
  </div>

  <!-- Filled in per game by tools/gen_shell.py from that game's game.yml.
       Left empty for a local build opened straight off disk, which is why the
       nav script below tolerates finding no panels. -->
  <!--PSE_TUTORIAL-->

  <div id="pad">
    <div class="dpad">
      <button type="button" data-dir="up"    data-key="ArrowUp"    aria-label="Up">&#9650;</button>
      <button type="button" data-dir="left"  data-key="ArrowLeft"  aria-label="Left">&#9664;</button>
      <div class="hub" aria-hidden="true"></div>
      <button type="button" data-dir="right" data-key="ArrowRight" aria-label="Right">&#9654;</button>
      <button type="button" data-dir="down"  data-key="ArrowDown"  aria-label="Down">&#9660;</button>
    </div>
    <div class="face">
      <button type="button" data-btn="x" data-key="KeyC" aria-label="X">X</button>
      <button type="button" data-btn="y" data-key="KeyV" aria-label="Y">Y</button>
      <button type="button" data-btn="a" data-key="KeyZ" aria-label="A">A</button>
      <button type="button" data-btn="b" data-key="KeyX" aria-label="B">B</button>
    </div>
  </div>
</div>

<script type="text/javascript">
(function () {
  "use strict";

  var statusElement = document.getElementById('status');
  var progressElement = document.getElementById('progress');
  var spinnerElement = document.getElementById('spinner');
  var bootElement = document.getElementById('boot');
  var canvasElement = document.getElementById('canvas');

  // ---- touch controls -----------------------------------------------------
  //
  // The 32blit SDL build reads the keyboard, so the on-screen pad synthesises
  // keyboard events rather than reaching into the engine. That keeps this shell
  // a presentation layer: it needs no knowledge of any game, and it keeps
  // working if the button mapping changes on the C++ side.
  //
  // 32blit-sdl/Input.cpp maps arrows and WASD to the D-pad, and z/x/c/v to
  // A/B/X/Y. Emscripten's SDL2 port registers its key listeners on `document`,
  // so that is where these are dispatched. keyCode is set alongside code and
  // key because the port still consults it.

  var KEYS = {
    ArrowUp:    { key: 'ArrowUp',    keyCode: 38 },
    ArrowDown:  { key: 'ArrowDown',  keyCode: 40 },
    ArrowLeft:  { key: 'ArrowLeft',  keyCode: 37 },
    ArrowRight: { key: 'ArrowRight', keyCode: 39 },
    KeyZ:       { key: 'z',          keyCode: 90 },
    KeyX:       { key: 'x',          keyCode: 88 },
    KeyC:       { key: 'c',          keyCode: 67 },
    KeyV:       { key: 'v',          keyCode: 86 }
  };

  var held = Object.create(null);

  function sendKey(type, code) {
    var spec = KEYS[code];
    if (!spec) return;
    var event = new KeyboardEvent(type, {
      key: spec.key,
      code: code,
      keyCode: spec.keyCode,
      which: spec.keyCode,
      bubbles: true,
      cancelable: true,
      composed: true
    });
    // Some browsers ignore keyCode from the init dict. Force it, otherwise the
    // SDL port sees keyCode 0 and drops the press.
    if (event.keyCode !== spec.keyCode) {
      try {
        Object.defineProperty(event, 'keyCode', { get: function () { return spec.keyCode; } });
        Object.defineProperty(event, 'which', { get: function () { return spec.keyCode; } });
      } catch (ignored) { /* nothing else to try */ }
    }
    document.dispatchEvent(event);
  }

  function press(code, button) {
    if (held[code]) return;         // no key repeat: the game polls button state
    held[code] = true;
    if (button) {
      button.classList.add('held');
      // A short tap of haptics so a glass button pushes back. Gated on the
      // on-screen pad only: physical keyboards bring their own feedback.
      // vibrate() is absent on iOS Safari and can throw when a page has had
      // no user gesture yet, so both failures are swallowed on purpose.
      if (navigator.vibrate) {
        try { navigator.vibrate(12); } catch (ignored) { /* no haptics */ }
      }
    }
    sendKey('keydown', code);
  }

  function release(code, button) {
    if (!held[code]) return;
    held[code] = false;
    if (button) button.classList.remove('held');
    sendKey('keyup', code);
  }

  var buttons = Array.prototype.slice.call(
    document.querySelectorAll('#pad button[data-key]'));

  var activePointers = Object.create(null);

  buttons.forEach(function (button) {
    var code = button.getAttribute('data-key');

    button.addEventListener('pointerdown', function (event) {
      event.preventDefault();
      // Deliberately no setPointerCapture: capture keeps every later move event
      // on the original button, which breaks sliding between D-pad arrows.
      activePointers[event.pointerId] = button;
      press(code, button);
    });

    button.addEventListener('pointerenter', function (event) {
      // Sliding a finger onto a button presses it, so diagonals and thumb rolls
      // work the way they do on a real pad.
      if (activePointers[event.pointerId] === undefined) return;
      var previous = activePointers[event.pointerId];
      if (previous && previous !== button) {
        release(previous.getAttribute('data-key'), previous);
      }
      activePointers[event.pointerId] = button;
      press(code, button);
    });
  });

  function endPointer(event) {
    var button = activePointers[event.pointerId];
    if (!button) return;
    release(button.getAttribute('data-key'), button);
    delete activePointers[event.pointerId];
  }

  // Listen on the window so a finger released off the pad still ends the press.
  // Without pointercancel a browser gesture can strand a key in the down state
  // and the player walks into a wall forever.
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // Losing focus or visibility must release everything, for the same reason.
  function releaseAll() {
    buttons.forEach(function (button) {
      release(button.getAttribute('data-key'), button);
    });
    activePointers = Object.create(null);
  }
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) releaseAll();
  });

  var padElement = document.getElementById('pad');
  // Block the double-tap-to-zoom and long-press-select gestures that otherwise
  // fire on top of the pad.
  padElement.addEventListener('touchstart',
    function (e) { e.preventDefault(); }, { passive: false });
  padElement.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---- the mini tutorial --------------------------------------------------
  //
  // Paging only. The panels themselves are written into this page per game by
  // tools/gen_shell.py, so this knows nothing about any particular game and
  // does nothing at all when a build has no panels, which is the case for a
  // shell opened straight off disk.

  (function () {
    var panels = Array.prototype.slice.call(
      document.querySelectorAll('#tutorial [data-panel]'));
    if (!panels.length) return;
    var dots = Array.prototype.slice.call(
      document.querySelectorAll('#tutorial [data-dot]'));
    var at = 0;

    function show(index) {
      at = (index + panels.length) % panels.length;
      panels.forEach(function (panel, i) {
        if (i === at) panel.setAttribute('data-shown', '');
        else panel.removeAttribute('data-shown');
      });
      dots.forEach(function (dot, i) {
        if (i === at) dot.setAttribute('data-on', '');
        else dot.removeAttribute('data-on');
      });
    }

    var prev = document.getElementById('tut-prev');
    var next = document.getElementById('tut-next');
    if (prev) prev.addEventListener('click', function () { show(at - 1); });
    if (next) next.addEventListener('click', function () { show(at + 1); });
    show(0);
  })();

  // ---- pad visibility -----------------------------------------------------

  var STORAGE_KEY = 'picosystem-pad';
  var isTouch = window.matchMedia('(pointer: coarse)').matches ||
                'ontouchstart' in window;

  function setPad(on) {
    document.body.classList.toggle('show-pad', on);
    try { localStorage.setItem(STORAGE_KEY, on ? '1' : '0'); } catch (ignored) {}
  }

  var stored = null;
  try { stored = localStorage.getItem(STORAGE_KEY); } catch (ignored) {}
  setPad(stored === null ? isTouch : stored === '1');

  document.getElementById('togglepad').addEventListener('click', function () {
    setPad(!document.body.classList.contains('show-pad'));
  });

  // ---- fullscreen ---------------------------------------------------------
  //
  // The whole app goes fullscreen, not the canvas: requesting it on the canvas
  // alone would take the gamepad off screen, which on a phone would make
  // fullscreen and playable mutually exclusive.

  var fullscreenButton = document.getElementById('fullscreen');

  fullscreenButton.addEventListener('click', function () {
    var target = document.getElementById('app');
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    var request = target.requestFullscreen || target.webkitRequestFullscreen;
    if (request) {
      var result = request.call(target);
      if (result && result.catch) result.catch(function () { /* denied */ });
    }
    // iPhone Safari has no Fullscreen API at all. The viewport meta and the dvh
    // sizing above are what make it usable there instead.
    if (screen.orientation && screen.orientation.lock) {
      var lock = screen.orientation.lock('landscape');
      if (lock && lock.catch) lock.catch(function () { /* not permitted */ });
    }
  });

  function syncFullscreenLabel() {
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fullscreenButton.textContent = on ? 'Exit' : 'Fullscreen';
  }
  document.addEventListener('fullscreenchange', syncFullscreenLabel);
  document.addEventListener('webkitfullscreenchange', syncFullscreenLabel);

  // Zoom the canvas with a transform rather than by sizing it in CSS.
  //
  // Two SDK behaviours make the obvious approach fail:
  //
  // 1. The SDL window is created SDL_WINDOW_RESIZABLE, so Emscripten keeps the
  //    canvas backing store in step with the element's CSS box. Setting a CSS
  //    size therefore changes the render buffer, not just how it is displayed.
  //
  // 2. Renderer.cpp hardcodes `Mode mode = KeepPixels`, which turns on
  //    SDL_RenderSetIntegerScale, and there is no command line switch for it.
  //    Integer scaling means a 240 pixel surface in a 378 pixel buffer scales
  //    by floor(378 / 240) = 1 and sits in the middle with a black border.
  //
  // Together those produced a small game marooned in a large black frame.
  //
  // So the CSS pins the element to a fixed 240x240, which pins the buffer to
  // 240x240 through (1). The console's surface is 240 in hires and 120 in
  // lores, so the integer scale lands on exactly 1x or 2x and fills the buffer
  // completely either way. A responsive CSS size cannot do this: it produces
  // arbitrary buffer sizes like 358, where floor(358 / 240) is 1 and the black
  // border comes back.
  //
  // The transform then magnifies to whatever space is going. It does not touch
  // the layout box, so it cannot feed back into the buffer, and
  // `image-rendering: pixelated` keeps the upscale sharp.
  var k_native = 240;

  function setZoom() {
    var frame = document.getElementById('frame');
    var box = frame.getBoundingClientRect();
    if (!box.width || !box.height) return;
    var zoom = Math.min(box.width / k_native, box.height / k_native);
    if (zoom > 0) canvasElement.style.transform = 'scale(' + zoom + ')';
  }
  window.addEventListener('resize', setZoom);
  window.addEventListener('orientationchange', setZoom);
  document.addEventListener('fullscreenchange', setZoom);

  // Keep arrow keys and space from scrolling the page behind the canvas.
  window.addEventListener('keydown', function (event) {
    if (KEYS[event.code] || event.code === 'Space') event.preventDefault();
  }, { passive: false });

  // ---- emscripten module --------------------------------------------------

  function mountIDBFS() {
    // Persistent filesystem over the save directory, as the SDK's own shell
    // does. Removing this loses saves between sessions.
    FS.mkdir("/libsdl");
    FS.mount(IDBFS, {}, '/libsdl');
    Module['addRunDependency']("SYNC_DATA");
    FS.syncfs(true, function (err) {
      Module['removeRunDependency']("SYNC_DATA");
    });
  }

  // The publish workflow injects a tiny script at the top of the body that
  // sets window.PSE_BUILD to the deployed sha. (Never write that tag out in
  // a comment here: a literal closing script tag ends this whole script
  // element at the HTML level.) Read the global through the window object
  // every time: Emscripten minifies this script, and a plain constant here
  // gets inlined, folded, and the entire version mechanism dead code
  // eliminated, which is exactly what happened to the first version of this
  // feature. A bracketed window lookup is opaque to every minifier. Local
  // builds have no injected global and skip everything version related.
  function pseBuild() { return window["PSE_BUILD"] || ""; }

  window.Module = {
    // Pages serves with max-age=600 and the filenames never change, so a
    // fresh deploy can sit behind a stale cache for ten minutes. The version
    // query makes each build's wasm and data distinct URLs; the script tag
    // gets the same treatment from the publish workflow.
    locateFile: function (path, prefix) {
      var v = pseBuild();
      return prefix + path + (v ? "?v=" + v : "");
    },
    // Match the device exactly.
    //
    // The SDL backend defaults to 320x240 (System::max_width/max_height), so
    // `hires` is 320x240 and `lores` is 160x120 in the browser. On the
    // PicoSystem the board config overrides the width to 240, giving 240x240
    // and 120x120. Without this the browser hands a game a wider surface than
    // it has on hardware, and a game that draws to its own fixed bounds leaves
    // black margins down the side.
    //
    // Passing --size makes the web surface identical to the device, so what you
    // test in a browser is what runs on the console.
    arguments: ["--size", "240,240"],
    preRun: [mountIDBFS],
    postRun: [function () {
      bootElement.classList.add('done');
      setTimeout(function () { bootElement.style.display = 'none'; }, 250);
      setZoom();
      canvasElement.focus();
    }],
    print: function (text) {
      if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
      console.log(text);
    },
    printErr: function (text) {
      if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
      console.error(text);
    },
    canvas: (function () {
      canvasElement.addEventListener("webglcontextlost", function (e) {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);
      return canvasElement;
    })(),
    setStatus: function (text) {
      if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
      if (text === Module.setStatus.last.text) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();
      if (m && now - Module.setStatus.last.time < 30) return;
      Module.setStatus.last.time = now;
      Module.setStatus.last.text = text;
      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
        progressElement.hidden = false;
        spinnerElement.hidden = false;
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.hidden = true;
      }
      statusElement.innerHTML = text;
    },
    totalDependencies: 0,
    monitorRunDependencies: function (left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left
        ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
        : 'All downloads complete.');
    }
  };

  // If a newer build than this page was published, offer a one tap reload.
  // The manifest fetch carries a unique query so it dodges the page cache
  // and notices within seconds of a deploy, instead of after ten minutes.
  if (pseBuild()) {
    fetch('../builds.json?_=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (m) {
        var slug = location.pathname.replace(/\/+$/, '').split('/').pop();
        var mine = null;
        (m.games || []).forEach(function (g) {
          if (g.slug === slug) mine = g;
        });
        if (!mine || mine.commit === pseBuild()) return;
        var pill = document.createElement('button');
        pill.id = 'newbuild';
        pill.textContent = 'new build ' + mine.commit + ' - tap to reload';
        pill.addEventListener('click', function () {
          location.replace(location.pathname + '?v='
                           + (mine.commit || mine.fingerprint));
        });
        document.body.appendChild(pill);
      })
      .catch(function () {});
  }

  Module.setStatus('Downloading...');
  // A crash on a phone has no JavaScript console. Put the real error on
  // the page with a copy button, so any device can report exactly what
  // broke and which build broke it.
  var crashShown = false;
  function showCrash(detail) {
    if (crashShown) return;
    crashShown = true;
    spinnerElement.style.display = 'none';
    Module.setStatus('');
    Module.setStatus = function (text) {
      if (text) Module.printErr('[post-exception status] ' + text);
    };
    var report = 'build ' + (pseBuild() || 'local') + ' at ' +
                 location.pathname + '\n' + detail;
    var panel = document.createElement('div');
    panel.id = 'crash';
    var head = document.createElement('div');
    head.className = 'crash-head';
    head.textContent = 'the game crashed';
    var body = document.createElement('pre');
    body.className = 'crash-body';
    body.textContent = report;
    var copy = document.createElement('button');
    copy.className = 'crash-copy';
    copy.textContent = 'copy error';
    copy.addEventListener('click', function () {
      var done = function () { copy.textContent = 'copied'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(report).then(done, function () {
          fallbackCopy(report, done);
        });
      } else {
        fallbackCopy(report, done);
      }
    });
    panel.appendChild(head);
    panel.appendChild(body);
    panel.appendChild(copy);
    document.body.appendChild(panel);
  }
  function fallbackCopy(text, done) {
    var area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.focus();
    area.select();
    try { document.execCommand('copy'); done(); } catch (err) {}
    document.body.removeChild(area);
  }
  window.onerror = function (message, source, lineno, colno, error) {
    var detail = String(message);
    if (error && error.stack) detail += '\n' + error.stack;
    else if (source) detail += '\n' + source + ':' + lineno + ':' + colno;
    showCrash(detail);
  };
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    var detail = 'unhandled rejection: ' + String(reason);
    if (reason && reason.stack) detail += '\n' + reason.stack;
    showCrash(detail);
  });
})();
</script>
{{{ SCRIPT }}}
