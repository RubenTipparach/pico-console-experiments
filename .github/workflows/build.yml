name: Build and publish

on:
  # main builds on every push, and every build publishes: the site is always
  # what main last produced. No other branch builds on its own, because a
  # branch build is a deliberate act, not a side effect of pushing. Dispatch
  # one by hand and it deploys under preview/<branch>/.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      games:
        description: "Slugs to build, comma separated. Empty builds everything build.yaml enables."
        required: false
        default: ""
      publish:
        description: "Deploy to the site ROOT from a non default branch. Off by default; branches deploy to preview/<branch>/ regardless."
        type: boolean
        required: false
        default: false

# One publish at a time. Every run of this workflow publishes now, and two runs
# overlaying the gh-pages tree concurrently will race until one push is
# rejected. cancel-in-progress stays false: a half applied overlay is worse
# than a slow queue. That queue is only as good as the run at the head of it,
# which is why every job below carries a timeout-minutes: a job wedged in apt
# has twice held this lock for over an hour and kept a merge to main off the
# site, and GitHub's default would have let it hold the lock for six.
concurrency:
  group: pico-console-publish
  cancel-in-progress: false

permissions:
  # contents: write is for the gh-pages state branch, which is how a game that
  # did not rebuild keeps the binaries it already had. pages + id-token are what
  # actions/deploy-pages needs.
  contents: write
  pages: write
  id-token: write

env:
  # The 32blit SDK and the `32blit` python tool are versioned separately and the
  # numbers look confusingly similar. The SDK's latest tag is v0.3.3; the tool is
  # at 0.7.x, and 32blit-config.cmake requires tool >= 0.7.3. Do not pin the SDK
  # to a tool version.
  BLIT_SDK_TAG: v0.3.3
  PICO_SDK_TAG: 2.0.0
  EMSDK_VERSION: 3.1.61
  # A second SDK pair, for the Tufty 2350 only.
  #
  # Not a version bump of the pair above: those are what every PicoSystem and
  # web build this site has ever published was made with, and the Tufty does
  # not need them moved. It needs newer ones. Its board config landed in
  # 32blit master in March 2026 and the newest tag, v0.3.3, is from December
  # 2024 with no pimoroni_tufty2350 directory at all; pico-sdk 2.0.0 is too
  # old as well, since the board header wants PICO_RP2350_A2_SUPPORTED and
  # the config pulls in hardware_powman.
  #
  # A commit rather than a branch so a rerun of an old commit builds the same
  # tree it built the first time.
  BLIT_SDK_TUFTY_SHA: db99cb7fad2ee163bf7251193566bfcf6781da7c
  PICO_SDK_TUFTY_TAG: 2.3.0

jobs:
  # Fails in seconds if the renderer is broken, before any cross compile starts.
  engine-tests:
    runs-on: ubuntu-latest
    # Runs in about ten seconds. Everything past a minute is a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host tests
        run: |
          cmake -S . -B build.test -DBUILD_ENGINE_TESTS=ON
          cmake --build build.test --parallel
          ctest --test-dir build.test --output-on-failure

      # The metadata block is what a standalone .uf2 says about itself, and
      # nothing downstream would notice if it silently stopped reaching the
      # binary. gen_library is what the console's menu is made of, and it is
      # the only thing standing between a bad console.yaml and a device that
      # boots into the wrong game. game_entry is here because a game that
      # defines the SDK's own init/update/render compiles perfectly, passes
      # every host test, and then collides with the generated shim at the
      # device link, which is the first job on main and far too late.
      # pack_picocad_texture is here because both of its failure modes are
      # invisible: a picoCAD model imported without flipping its winding gets
      # normals pointing into the hull, so it renders as a flat silhouette
      # rather than failing, and a v flip samples the sheet upside down and
      # picks plausible wrong colours. It also guards the assumption the whole
      # thing rests on, that every committed model is wound the other way,
      # which is what obj2cpp.face_normal compensates for. objmesh is the same
      # failure from the other end: a face a GENERATOR wound the wrong way
      # round is not drawn dark, it is not drawn at all, and a whole mesh's
      # signed volume cannot see it because two opposite faces flipped together
      # very nearly cancel. Twin Flare's cockpit shipped with no roof that way.
      - name: Test the build tooling
        run: |
          python3 tools/tests/test_game_meta.py
          python3 tools/tests/test_gen_library.py
          python3 tools/tests/test_make_thumbnail.py
          python3 tools/tests/test_gen_gallery.py
          python3 tools/tests/test_gen_mockups.py
          python3 tools/tests/test_jokerreels_art.py
          python3 tools/tests/test_twinflare_sound.py
          python3 tools/tests/test_gen_shell.py
          python3 tools/tests/test_game_entry.py
          python3 tools/tests/test_screen_mode.py
          python3 tools/tests/test_board_agnostic.py
          python3 tools/tests/test_pack_picocad_texture.py
          python3 tools/tests/test_picomon_sprites.py
          python3 tools/tests/test_picomon_trees.py
          python3 tools/tests/test_trackshape.py
          python3 tools/tests/test_objmesh.py

  # Reads build.yaml and turns it into the build matrix. Every enabled game is
  # built, every run: what gets built is a decision written down in the repo,
  # not something inferred from content hashes.
  detect:
    runs-on: ubuntu-latest
    # Reads build.yaml and writes the matrix. Seconds.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      built: ${{ steps.plan.outputs.built }}
      held: ${{ steps.plan.outputs.held }}
      prefix: ${{ steps.where.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out where this build publishes
        id: where
        env:
          FORCE_ROOT: ${{ github.event.inputs.publish }}
        run: |
          set -euo pipefail
          flag=""
          [ "${FORCE_ROOT:-}" = "true" ] && flag="--force-root"
          prefix=$(python3 tools/site_prefix.py \
            --ref-name "$GITHUB_REF_NAME" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            $flag)
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "publishing to '${prefix:-<root>}'"

      - name: Plan the build
        id: plan
        env:
          GAMES_INPUT: ${{ github.event.inputs.games }}
        run: |
          # GAMES_INPUT goes through the environment, never spliced into the
          # script text, so a dispatch input cannot inject shell.
          python3 tools/build_plan.py plan --games "${GAMES_INPUT:-}"

  build:
    needs: [detect, engine-tests]
    # An empty matrix vector is a hard workflow failure, not a skip, so the
    # guard is mandatory. It is a separate boolean rather than a comparison
    # against '[]' because that string coercion is not reliable.
    if: needs.detect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    # A leg was about three minutes warm and about six cold, since the
    # emscripten half deliberately never caches. It now compiles each game a
    # third time, for the Tufty, so budget for roughly half again on top. 35
    # leaves room for a slow mirror and still fails a wedged apt in minutes.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache python3 python3-pip \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          pip3 install --user 32blit

      - name: Cache SDKs
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../32blit-sdk
            ${{ github.workspace }}/../pico-sdk
          key: sdks-${{ env.BLIT_SDK_TAG }}-${{ env.PICO_SDK_TAG }}

      - name: Check out the SDKs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/..
        run: |
          git clone --depth 1 --branch "$BLIT_SDK_TAG" \
            https://github.com/32blit/32blit-sdk
          git clone --depth 1 --branch "$PICO_SDK_TAG" \
            https://github.com/raspberrypi/pico-sdk
          # Only tinyusb is needed. `--recursive` would also drag in btstack,
          # cyw43-driver, lwip and mbedtls and roughly triple the cache.
          git -C pico-sdk submodule update --init lib/tinyusb

      - name: Cache the Tufty SDKs
        id: tufty-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../32blit-sdk-tufty
            ${{ github.workspace }}/../pico-sdk-tufty
          key: tufty-sdks-${{ env.BLIT_SDK_TUFTY_SHA }}-${{ env.PICO_SDK_TUFTY_TAG }}

      - name: Check out the Tufty SDKs
        if: steps.tufty-sdk-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/..
        run: |
          set -euo pipefail
          # A sha cannot be cloned with --branch, so init and fetch it.
          mkdir -p 32blit-sdk-tufty
          git -C 32blit-sdk-tufty init -q
          git -C 32blit-sdk-tufty remote add origin \
            https://github.com/32blit/32blit-sdk
          git -C 32blit-sdk-tufty fetch --depth 1 origin "$BLIT_SDK_TUFTY_SHA"
          git -C 32blit-sdk-tufty checkout -q FETCH_HEAD
          git clone --depth 1 --branch "$PICO_SDK_TUFTY_TAG" \
            https://github.com/raspberrypi/pico-sdk pico-sdk-tufty
          git -C pico-sdk-tufty submodule update --init lib/tinyusb

      # Object level reuse for the compiles that do have to run: a game whose
      # dependencies changed still shares almost every SDK object with its
      # previous build. Keyed per game so concurrent matrix jobs never fight
      # over one entry; the sha suffix makes every run save, and restore-keys
      # pull the newest previous entry.
      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.slug }}-${{ env.BLIT_SDK_TAG }}-${{ env.PICO_SDK_TAG }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.slug }}-${{ env.BLIT_SDK_TAG }}-${{ env.PICO_SDK_TAG }}-

      # Emscripten rebuilds its system libraries into EM_CACHE on first use.
      # The emsdk cache below cannot carry them: its key is static, so it was
      # saved before any build populated it. This entry's first miss happens
      # on a run that does build them, so it is saved populated.
      - name: Cache Emscripten system libraries
        if: matrix.web
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../em-cache
          key: emlibs-${{ env.EMSDK_VERSION }}

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/..
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk
          cd emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Build the .uf2 for PicoSystem
        env:
          GAME: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # 300M rather than 150M: one leg now compiles the same game for two
          # different architectures, so the objects a warm cache has to hold
          # roughly doubled, and a cache that evicts what the next board is
          # about to ask for is a cache that never hits.
          ccache --max-size=300M --zero-stats
          cmake -S . -B build.pico -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/../32blit-sdk/pico.toolchain" \
            -DPICO_BOARD=pimoroni_picosystem \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/../pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPICO_ONLY_GAME="$GAME" \
            -DPSE_BUILD_VERSION="${GITHUB_SHA::7}"
          cmake --build build.pico --parallel

          # The metadata block is what this .uf2 says about itself, and it is
          # the kind of thing that disappears silently: it compiles, lands in
          # the object file, and gets collected by --gc-sections on the way to
          # the .uf2. Nothing downstream would notice, so check the artifact
          # itself.
          python3 tools/game_meta.py extract --uf2 "$(find build.pico -name "$TARGET.uf2" -print -quit)"
          ccache --show-stats

      # pico2.toolchain, NOT pico.toolchain. The latter hardcodes
      # -mcpu=cortex-m0plus, configures without complaint, and then dies in
      # the middle of the compile: engine/src/parallel_pico.cpp includes
      # pico/multicore.h, RP2350 defaults PICO_USE_SW_SPIN_LOCKS on for errata
      # E2, and that implementation is gated on __ARM_ARCH_8M_MAIN__, which an
      # ARMv6-M build does not define. spin_lock.h then reaches its "#error no
      # SW_SPIN_LOCK_LOCK available ... on this platform" fallback, which reads
      # like a broken SDK and is a wrong -mcpu.
      #
      # A separate build directory and its own SDK pair, so nothing here can
      # reach into the PicoSystem build or the web one.
      - name: Build the .uf2 for Tufty 2350
        env:
          GAME: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cmake -S . -B build.tufty -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/../32blit-sdk-tufty/pico2.toolchain" \
            -DPICO_BOARD=pimoroni_tufty2350 \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/../pico-sdk-tufty" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPICO_ONLY_GAME="$GAME" \
            -DPSE_BUILD_VERSION="${GITHUB_SHA::7}"
          cmake --build build.tufty --parallel
          python3 tools/game_meta.py extract --uf2 "$(find build.tufty -name "$TARGET.uf2" -print -quit)"
          ccache --show-stats

      - name: Build for the browser
        if: matrix.web
        env:
          GAME: ${{ matrix.slug }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          source "$GITHUB_WORKSPACE/../emsdk/emsdk_env.sh"
          # NO ccache and NO persistent EM_CACHE here, on purpose. A warm
          # ccache once shipped a wasm whose EM_ASM addresses no longer
          # matched its JS: the game compiled green and died on its first
          # frame. Web builds are cheap enough to pay for correctness.
          # 32BLIT_DIR must be absolute for Emscripten builds.
          emcmake cmake -S . -B build.web \
            -D32BLIT_DIR="$GITHUB_WORKSPACE/../32blit-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_ONLY_GAME="$GAME"
          cmake --build build.web --parallel

      - name: Collect the outputs
        env:
          GAME: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
          WANTS_WEB: ${{ matrix.web }}
        run: |
          set -euo pipefail
          mkdir -p "out/web/$GAME" out/uf2 out/uf2-tufty

          uf2=$(find build.pico -name "$TARGET.uf2" -print -quit)
          if [ -z "$uf2" ]; then
            echo "::error::no .uf2 produced for $GAME"
            exit 1
          fi
          cp "$uf2" "out/uf2/$GAME.uf2"

          tufty=$(find build.tufty -name "$TARGET.uf2" -print -quit)
          if [ -z "$tufty" ]; then
            echo "::error::no Tufty .uf2 produced for $GAME"
            exit 1
          fi
          cp "$tufty" "out/uf2-tufty/$GAME.uf2"

          if [ "$WANTS_WEB" = "true" ]; then
            # add_picosystem_game renames the Emscripten target to `index`,
            # because GitHub Pages has no directory listing and only
            # /<slug>/index.html is reachable.
            src=$(dirname "$(find build.web -name 'index.wasm' -print -quit)")
            if [ -z "$src" ] || [ ! -f "$src/index.html" ]; then
              echo "::error::no web build produced for $GAME"
              exit 1
            fi
            cp "$src/index.html" "$src/index.js" "$src/index.wasm" "out/web/$GAME/"
            # .data only exists when the game ships packaged assets.
            cp "$src/index.data" "out/web/$GAME/" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.slug }}
          path: out
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [engine-tests, detect, build]
    # Building is publishing here: a run that gets this far deploys what it
    # built, plus whatever the state branch already carried for held games.
    #
    # A skipped `build` is only allowed through when there was nothing to
    # build, which under build.yaml means every game is held. It used to be
    # allowed unconditionally, on the reasoning that a skip meant "nothing
    # changed": that reasoning died with change detection, and the result was
    # a run whose host tests failed, whose build never ran, and which
    # published anyway. A red run must not reach the site.
    #
    # engine-tests is a dependency for the same reason. It was not one before,
    # so a failing test suite could deploy as long as the build job had not
    # been reached yet.
    #
    # Any branch may deploy, because a non default branch only ever writes
    # under preview/<branch>/. Reaching the site root still takes the default
    # branch, or an explicit publish=true dispatch.
    if: >-
      ${{ !cancelled()
          && needs.engine-tests.result == 'success'
          && needs.detect.result == 'success'
          && (needs.build.result == 'success'
              || (needs.build.result == 'skipped'
                  && needs.detect.outputs.has_work != 'true')) }}
    runs-on: ubuntu-latest
    # Assembles the site, boot checks every page in a real browser, deploys.
    # The browser setup is the slow part and is the other place apt has hung.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the site state
        run: |
          # actions/checkout hard fails on a missing ref and has no
          # create-if-missing, so the orphan branch is bootstrapped by hand.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git worktree add site FETCH_HEAD --detach
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p site/uf2 site/uf2-tufty site/thumbs

      - uses: actions/download-artifact@v4
        with:
          pattern: game-*
          path: incoming
          merge-multiple: true
        continue-on-error: true

      - name: Overlay the rebuilt games
        env:
          BUILT: ${{ needs.detect.outputs.built }}
          PREFIX: ${{ needs.detect.outputs.prefix }}
        run: |
          set -euo pipefail
          mkdir -p "site/${PREFIX}uf2" "site/${PREFIX}uf2-tufty" "site/${PREFIX}thumbs"
          [ -d incoming ] || { echo "nothing rebuilt this run"; exit 0; }

          for slug in $(echo "$BUILT" | tr ',' ' '); do
            [ -n "$slug" ] || continue
            if [ -d "incoming/web/$slug" ]; then
              mkdir -p "site/${PREFIX}$slug"
              # --delete removes files a previous build left behind, and the
              # exclude keeps a captured thumbnail from being swept up with
              # them. Without the exclude, republishing a game silently
              # destroys its screenshot.
              #
              # --checksum is load bearing, not a nicety. rsync's default
              # quick check calls a file unchanged when its size and mtime
              # match, and Emscripten's index.js is the exact shape that
              # defeats: its ASM_CONSTS keys are addresses into the wasm's
              # data, so they move whenever the game's data layout moves,
              # but they stay the same NUMBER OF DIGITS, so the file's size
              # never changes. The site checkout and the artifact download
              # land in the same second, so the mtimes match too, and every
              # rebuild silently kept the first index.js a game ever
              # published while replacing its wasm. A game survives that
              # until its EM_ASM addresses shift, then dies on boot with
              # ASM_CONSTS[emAsmAddr] is not a function. Compare contents.
              rsync -a --checksum --delete --exclude 'thumbnail.png' \
                "incoming/web/$slug/" "site/${PREFIX}$slug/"
              # Stamp the build into the page and its asset URLs. Pages
              # caches everything for ten minutes under unchanging names, so
              # without the version query a device that just played the old
              # build keeps serving it from cache after the deploy.
              #
              # Emscripten minifies the page: attribute quotes are stripped
              # and inline constants get folded away, so the injection has to
              # anchor on <body> (which survives) and set a window global
              # (which no minifier can fold), and the script tag sed has to
              # match the quoted and unquoted forms both.
              html="site/${PREFIX}$slug/index.html"
              if [ -f "$html" ]; then
                v="${GITHUB_SHA::7}"
                sed -i "s|<body>|<body><script>window.PSE_BUILD=\"$v\"</script>|" "$html"
                sed -i "s|src=\"index.js\"|src=\"index.js?v=$v\"|; s|src=index.js|src=index.js?v=$v|" "$html"
              fi
              echo "published site/${PREFIX}$slug/"
            fi
            if [ -f "incoming/uf2/$slug.uf2" ]; then
              cp "incoming/uf2/$slug.uf2" "site/${PREFIX}uf2/$slug.uf2"
            fi
            # A game held back before the Tufty existed has no file here, and
            # the gallery tests each one for itself, so a missing board is a
            # card with one button rather than a link to a 404.
            if [ -f "incoming/uf2-tufty/$slug.uf2" ]; then
              cp "incoming/uf2-tufty/$slug.uf2" "site/${PREFIX}uf2-tufty/$slug.uf2"
            fi
          done

      # Mockups are copied straight from the repo checkout, not carried
      # forward on the state branch, because they are source and not build
      # output: whatever is on main is what should be on the site. --delete
      # matters here, since a mockup deleted from the repo would otherwise
      # live on the site for ever, and the index is written after the copy
      # because it is written INTO the directory --delete manages.
      - name: Publish the mockups
        env:
          PREFIX: ${{ needs.detect.outputs.prefix }}
        run: |
          set -euo pipefail
          if [ ! -d mockups ]; then
            echo "no mockups in this tree"
            exit 0
          fi
          mkdir -p "site/${PREFIX}mockups"
          rsync -a --checksum --delete mockups/ "site/${PREFIX}mockups/"
          python3 tools/gen_mockups.py \
            --source mockups \
            --out "site/${PREFIX}mockups" \
            --repo "$GITHUB_REPOSITORY" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # A compiled game is not a working game, and a checked game is not the
      # game that ships. This runs on the ASSEMBLED SITE, after the overlay
      # and the stamping, because that is the only tree the deploy actually
      # uploads. It used to check the build artifact instead, which is why a
      # publish that dropped a game's index.js on the way to the site went
      # out green: the artifact booted perfectly, and something else was
      # deployed. Whatever assembly does from here on, this sees it.
      - name: Boot check the site that is about to deploy
        env:
          BUILT: ${{ needs.detect.outputs.built }}
          PREFIX: ${{ needs.detect.outputs.prefix }}
        run: |
          set -euo pipefail
          root="site/${PREFIX%/}"
          needed=""
          for slug in $(echo "$BUILT" | tr ',' ' '); do
            [ -n "$slug" ] || continue
            [ -f "$root/$slug/index.html" ] && needed="$needed $slug"
          done
          if [ -z "$needed" ]; then
            echo "no web builds this run"
            exit 0
          fi
          PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(tools/setup_browser.sh)"
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE
          for slug in $needed; do
            python3 tools/boot_check.py --dir "$root" --slug "$slug"
          done

      # The mockups run a whole simulation in one file, so a broken one is a
      # dead page in exactly the way a dead game is: jokerreels validates its
      # own symbol art and throws rather than shipping a symbol with no
      # outline, and nothing downstream would notice. Checked with --kind
      # page, which drops the tutorial assertions a game gets and keeps the
      # only one that applies here: it must not throw. All seven were clean
      # when this was added, so it starts green rather than grandfathering a
      # failure in.
      - name: Boot check the mockups
        env:
          PREFIX: ${{ needs.detect.outputs.prefix }}
        run: |
          set -euo pipefail
          root="site/${PREFIX}mockups"
          [ -d "$root" ] || { echo "no mockups on this site"; exit 0; }
          PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(tools/setup_browser.sh)"
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE
          for dir in "$root"/*/; do
            [ -f "$dir/index.html" ] || continue
            python3 tools/boot_check.py --dir "$root" \
              --slug "$(basename "$dir")" --kind page
          done

      - name: Capture a thumbnail for anything that has never had one
        env:
          BUILT: ${{ needs.detect.outputs.built }}
          PREFIX: ${{ needs.detect.outputs.prefix }}
        run: |
          set -euo pipefail
          needed=""
          for slug in $(echo "$BUILT" | tr ',' ' '); do
            [ -n "$slug" ] || continue
            # First capture only. An existing thumbnail is never replaced here:
            # refreshing one is a deliberate act, done through the
            # "Capture thumbnails" workflow.
            if [ -f "site/${PREFIX}$slug/index.html" ] && [ ! -f "site/${PREFIX}thumbs/$slug.png" ]; then
              needed="$needed $slug"
            fi
          done
          if [ -z "$needed" ]; then
            echo "every published game already has a thumbnail"
            exit 0
          fi
          PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(tools/setup_browser.sh)"
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE
          for slug in $needed; do
            python3 tools/capture_thumbnail.py \
              --site "site/${PREFIX%/}" --slug "$slug" \
              --out "site/${PREFIX}thumbs/$slug.png"
          done

      - name: Prefer a thumbnail committed in the repo
        env:
          PREFIX: ${{ needs.detect.outputs.prefix }}
        run: |
          set -euo pipefail
          for dir in games/*/; do
            slug=$(python3 -c "import sys,os;sys.path.insert(0,'tools');from build_plan import Game;print(Game(os.path.abspath('$dir')).slug)")
            if [ -f "$dir/thumbnail.png" ]; then
              cp "$dir/thumbnail.png" "site/${PREFIX}thumbs/$slug.png"
            fi
          done

      - name: Write the manifest and the gallery
        env:
          PLANNED: ${{ needs.detect.outputs.built }}
          PREFIX: ${{ needs.detect.outputs.prefix }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Left empty so gen_gallery names the site itself, from --repo: it
          # reads the repo's dashes as spaces, which a path needs and a sign
          # over a cabinet does not. Naming it here is what put the hyphens
          # back on the marquee, because the generator's default is dead code
          # whenever this is set. A preview still overrides it, since a branch
          # name is an identifier and wants showing verbatim.
          title=""
          [ -n "$PREFIX" ] && title="$GITHUB_REF_NAME (preview)"

          # Claim what arrived, not what was planned. The manifest's commit is
          # what the gallery links and what the shell compares against to
          # offer a reload, so a game stamped with a commit it was not built
          # from sends players to a build that does not exist. A run whose
          # build never happened once published a manifest saying otherwise.
          built=""
          for slug in $(echo "$PLANNED" | tr ',' ' '); do
            [ -n "$slug" ] || continue
            if [ -d "incoming/web/$slug" ] || [ -f "incoming/uf2/$slug.uf2" ]; then
              built="${built:+$built,}$slug"
            else
              echo "::warning::$slug was planned but produced nothing, so the" \
                   "manifest keeps its previous commit"
            fi
          done
          echo "manifest claims: ${built:-nothing}"

          python3 tools/build_plan.py manifest \
            --published "site/${PREFIX}builds.json" \
            --built "$built" \
            --out "site/${PREFIX}builds.json" \
            --timestamp "$stamp" \
            --commit "${GITHUB_SHA::7}"
          python3 tools/gen_gallery.py \
            --site "site/${PREFIX%/}" \
            --manifest "site/${PREFIX}builds.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --timestamp "$stamp"

      - name: Save the site state
        run: |
          set -euo pipefail
          cd site
          git add --all
          # Content comparison, not mtime. Emscripten rewrites every output file
          # on every build, so mtimes always change, but a byte identical
          # rebuild correctly produces no commit.
          if git diff --cached --quiet; then
            echo "site is unchanged, nothing to push"
            exit 0
          fi
          git commit -m "Site state for ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "push rejected, refetching (attempt $attempt)"
            git fetch origin gh-pages && git rebase FETCH_HEAD || true
            sleep $((attempt * 4))
          done
          echo "::error::could not push the site state after 3 attempts"
          exit 1

      # Pages is served from the Actions artifact, not from a branch. The whole
      # site is uploaded every run, including the games that were not rebuilt,
      # because deploy-pages replaces the entire site each deployment. That is
      # exactly why the gh-pages state branch above exists: it carries the
      # previous build forward so a full site can be assembled without
      # rebuilding everything.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          # The tarball drops dotfiles by default, which would eat .nojekyll.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Twenty minutes, up from this action's own ten minute default.
          #
          # Two consecutive runs failed here and nowhere else, both at exactly
          # ten minutes, with everything before them green: run 112 sat in
          # deployment_queued and run 113 in deployment_in_progress. Neither is
          # a build problem. Both had already compiled every game for device
          # and for the browser, boot checked the assembled site in a real
          # browser, and uploaded it. Pages was simply slower than the action
          # was willing to wait, and the run then CANCELLED a deployment that
          # was still making progress, so a good build never reached the site.
          #
          # This is the job's own budget being spent honestly rather than a
          # retry: publish is timeout-minutes 30 and the steps ahead of this
          # one take about a minute, so twenty here still leaves the job able
          # to fail on its own terms if Pages is genuinely wedged instead of
          # merely slow. Raising it further would start hiding a real outage.
          timeout: 1200000

  # A terminal job so a run with every game held still reports success. A
  # skipped matrix job never reports, which silently blocks branch protection if
  # `build` is the required check. Make this the required check instead.
  gate:
    needs: [engine-tests, detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Writes the run summary and nothing else.
    timeout-minutes: 10
    steps:
      - name: Summarise
        env:
          BUILT: ${{ needs.detect.outputs.built }}
          HELD: ${{ needs.detect.outputs.held }}
        run: |
          echo "built: ${BUILT:-none}"
          echo "held:  ${HELD:-none}"
          if [ "${{ needs.engine-tests.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.detect.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build.result }}" = "failure" ]; then exit 1; fi
