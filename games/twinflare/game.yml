# Gallery and build metadata. See games/README.md for every field.

slug: twinflare
title: Twin Flare
blurb: Two engines on cables, four planets, one hover field.
target: twinflare
sdk: 32blit
web: true

objective: "Three laps against five rivals. The pod hangs off two engines and a hover field keeps it off the ground, so it never crashes into the road, only off it. Each engine takes damage on its own, and a damaged one pulls you toward it. Repair costs speed, boosting costs heat, and heat costs engines."

rules:
  - "The grid: Three seconds on the line before the light goes green, and holding the throttle through them winds the engines up. The bar under the number is the charge and the red mark is where it blows: let it reach that and both engines take the damage before you have moved. Stop short and the charge becomes a boost off the line."
  - "Damage: Each engine has its own bar because each one takes its own damage. A wall grinds the engine on the side you hit it with. A hard landing goes to whichever engine is lower, so a slam mid corner lands on the inside one. A rival you touch damages the engine that touched it. An engine that is nearly out trails smoke."
  - "One engine left: Lose an engine outright and the pod is coming apart. Three seconds on the clock, counted down on screen and in your ears, and then it goes. Nothing stops it: repair cannot bring a dead engine back, so there is no button to hold and nothing to nurse. What the three seconds buy is the chance to reach a line, back off a jump, or watch it coming."
  - "Under the sea: A third of TIDEBREAK's causeway runs below the waterline, and the pod goes down with it. The sea closes over you, the light goes green and dim, and the water costs you speed for as long as you are in it. You are still on the road down there: the hover field holds you off the tarmac exactly as it does in the dry, so the dive is a stretch to be driven rather than a hazard to survive."
  - "The flag: Your race ends at the line and the pod flies itself while the rest of the field comes in, with each racer's time appearing as they cross. Any button skips to the results."

controls:
  - "B: throttle. Hold it on the grid to wind the engines up"
  - "B twice: boost, once the green light beside the heat bar is on"
  - "X: air brake, and it nearly doubles how hard you can turn"
  - "Y: repair both engines, at a third of the throttle"
  - "left/right: steer"
  - "up/down: pitch the nose. Nose up in the air to glide a gap"
  - "A: pause"

