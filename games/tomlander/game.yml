# Gallery and build metadata. See games/README.md for every field.

slug: tomlander
title: Tom Lander
blurb: Four pods, one hull, and a pad on the far side of the valley.
target: tomlander
sdk: 32blit
web: true

objective: "Put the ship down on the deck the arrow points at. A pod lifts its own corner, so the hull leans away from whatever you fire, and it goes where it points. One pod cannot hold you up. Two can. The number top right is your descent: green lands clean, amber bends something, red is a wreck. Green cubes are fuel, half a tank each. Run dry and you keep falling with no engines."

controls:
  - "X: fire the front pod"
  - "Y: fire the left pod"
  - "A: fire the right pod"
  - "B: fire the back pod"
  - "down: level the hull and fire all four"
  - "left/right: turn the camera"
  - "up: pause, and open the menu"
  - "up/down: move through a menu, any button picks"

models:
  - tom.obj
  - pad.obj
  - block.obj
  - tower.obj
  - cargo.obj
