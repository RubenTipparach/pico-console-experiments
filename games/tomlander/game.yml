# Gallery and build metadata. See games/README.md for every field.

slug: tomlander
title: Tom Lander
blurb: Four pods, one hull, and a pad on the far side of the valley.
target: tomlander
sdk: 32blit
web: true

objective: "Get off pad A and put the ship down on the deck the arrow points at, without breaking it. Each button fires the pod it sits at on the diamond, a firing pod lifts its own corner, and the hull goes wherever it ends up pointing. One pod cannot hold you up. Two can. The number top right is how fast you are falling: green sets down clean, amber lands but bends something, red is a wreck, and the hull only takes one bend. Watch the tank as well. Running it dry does not end the run on the spot, it just takes the engines away: you keep whatever speed and lean you had and you come down somewhere, and if that somewhere is the deck you were sent to, it still counts. Come to rest anywhere else with an empty tank and that is the end of it. A deck you are only passing through fills it back up. Land it and the second run opens: fetch the crate from the middle deck and carry it on to the far one, loaded and heavier. The third takes you to the coast, where a rocket stage is floating a long way out. Set down on it, then bring it home. The sea is not somewhere you can land."

controls:
  - "X: fire the front pod"
  - "Y: fire the left pod"
  - "A: fire the right pod"
  - "B: fire the back pod"
  - "down: level the hull and fire all four"
  - "left/right: turn the camera"
  - "up: pause, and open the menu"
  - "up/down: move through a menu, any button picks"

models:
  - tom.obj
  - pad.obj
  - block.obj
  - tower.obj
  - cargo.obj
