slug: picomon
title: Picomon
blurb: Walk the route, catch what lives in the grass.
target: picomon
sdk: 32blit
web: true

objective: "Walk out of Hometown, step into the tall grass, and catch what comes out of it. Wear a creature down before you throw, then build a team good enough to get past the trainers on the road north."

controls:
  - "up: walk, and turn to face"
  - "down: walk, and turn to face"
  - "left: walk, and turn to face"
  - "right: walk, and turn to face"
  - "A: talk, read, pick up, confirm"
  - "B: back"
  - "X: bag"
  - "Y: party"

