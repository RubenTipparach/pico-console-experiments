<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" width="100%" style="height:auto;display:block">
<title>Two paying lines make 220 chips, the best of them sets a multiplier of 6, and the spin scores 1320</title>
<rect x="6" y="7" width="8" height="8" fill="#ffb300"/>
<text x="19" y="14.0" textLength="32.4" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:700" fill="#ffb300" text-anchor="start">MIDDLE</text>
<text x="61.4" y="14.0" textLength="72" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:400" fill="#7a7590" text-anchor="start">THREE OF A KIND</text>
<text x="190.0" y="14.0" textLength="18" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700" fill="#5bc8ff" text-anchor="start">115</text><text x="212.0" y="14.0" textLength="24" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:400" fill="#7a7590" text-anchor="start">chips</text>
<text x="278.8" y="14.0" textLength="12" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700" fill="#ff4d7d" text-anchor="start">x6</text><text x="294.8" y="14.0" textLength="19.2" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:400" fill="#7a7590" text-anchor="start">mult</text>
<rect x="6" y="26" width="8" height="8" fill="#8b7fd4"/>
<text x="19" y="33.0" textLength="16.2" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:700" fill="#8b7fd4" text-anchor="start">TOP</text>
<text x="61.4" y="33.0" textLength="19.2" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:400" fill="#7a7590" text-anchor="start">PAIR</text>
<text x="190.0" y="33.0" textLength="18" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700" fill="#5bc8ff" text-anchor="start">105</text><text x="212.0" y="33.0" textLength="24" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:400" fill="#7a7590" text-anchor="start">chips</text>
<line x1="6" y1="47" x2="314" y2="47" stroke="currentColor" stroke-width="1" opacity="0.3"/>
<text x="6" y="65.0" textLength="38.4" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:400" fill="#7a7590" text-anchor="start">the pile</text>
<text x="54.0" y="65.0" textLength="18" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700" fill="#5bc8ff" text-anchor="start">115</text><text x="76.0" y="65.0" textLength="6" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:400" fill="currentColor" text-anchor="start">+</text><text x="86.0" y="65.0" textLength="18" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700" fill="#5bc8ff" text-anchor="start">105</text><text x="108.0" y="65.0" textLength="6" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:400" fill="currentColor" text-anchor="start">=</text><text x="118.0" y="65.0" textLength="18" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:700" fill="#5bc8ff" text-anchor="start">220</text>
<text x="6" y="86.0" textLength="43.2" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:400" fill="#7a7590" text-anchor="start">the score</text>
<text x="54.0" y="86.0" textLength="19.8" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700" fill="#5bc8ff" text-anchor="start">220</text><text x="80.8" y="86.0" textLength="6.6" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:400" fill="currentColor" text-anchor="start">x</text><text x="94.39999999999999" y="86.0" textLength="6.6" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700" fill="#ff4d7d" text-anchor="start">6</text>
<text x="314" y="86.0" textLength="46.8" lengthAdjust="spacing" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700" fill="#ffb300" text-anchor="end">= 1320</text>
</svg>
