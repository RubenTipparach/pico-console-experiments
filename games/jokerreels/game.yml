# Gallery and build metadata. See games/README.md for every field.

slug: jokerreels
title: Joker Reels
blurb: Five 3D reels, five paylines, and a deck you build.
target: jokerreels
sdk: 32blit
web: true

# The window this game rasterizes into, which is not the default 120x120
# square: it draws a 240x112 band. The engine sizes its one shared depth
# buffer to the largest window in the build, so declaring it here is what
# lets this game use the shared buffer instead of carrying a second one.
render:
  width: 240
  height: 112

objective: "Bank the ante's target in five spins, eight antes in a row. Five reels stop three rows deep and five paylines cross the grid, so one pull can pay several times over. Between antes the back room sells you the run: jokers, hand levels, and the thing it is really about, opening a reel and changing what it is able to land on."

# The scoring, split into panels rather than crammed into the objective.
#
# This game asks a player to pick a payline, read a hand and weigh a
# multiplier against how hard a symbol is to read, and none of that is
# discoverable from a control list. It was one enormous objective paragraph,
# which is a wall of text in the panel a player meets first and therefore a
# wall of text nobody reads. The same ground is covered in the game behind B,
# which is where a player who is already playing will look for it.
rules:
  - "Paylines: Five lines cross the grid. The middle row, the top, the bottom, and the two diagonals. Every one of them is one cell per reel, so every one of them is five symbols and can make a hand."
  - "Hands: A pair, two pair, three of a kind, a run, a full house, four, five. Every line that makes anything pays, and the game draws each line through the cells that made it while it counts, so you can see what you were paid for."
  - "Chips and mult: The best line sets the multiplier, and every other paying line adds its chips to the same pile. The score is the chips times the mult, counted out one line at a time: each line marks the cells that made it with a tick, the ones that did not with a cross, and its number climbs into the total rather than appearing there. A press of A runs the whole count faster without skipping any of it."
  - "The dial: The faster the reels turn the harder a symbol is to read, and the more a stop you time yourself is worth. Leave them alone and they stop themselves, for nothing, which is the floor and what one joker pays double for."
  - "Jokers: Bought in the back room, and they fire while the score counts. The one firing shakes in its slot and the number it added pops over the side of the sum it went into. Point the cursor at one between spins and the panel says what it does, and offers to move it along the row or sell it back. Order matters: one of them copies whatever is on its left."
  - "Consumables: One shot items, two slots to hold them. Some fire the moment you spend one, some load the next spin and pay as their own line in the count. The shop sells them beside the jokers, and it will reroll its whole shelf for gold if none of it is what you wanted."

controls:
  - "A: pull, then stop the next drum still turning. Hurries the count"
  - "up: move the cursor between the dial, the jokers and the consumables"
  - "down: the same, the other way round"
  - "left: turn the dial down, or pick along the row the cursor is in"
  - "right: turn the dial up, or pick along the row the cursor is in"
  - "X: spend the consumable you have picked"
  - "Y: pick the other consumable"
  - "B: how to play, from the table or the shop. Next reel, while one is open"
